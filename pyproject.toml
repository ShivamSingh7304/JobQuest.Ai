[project]
name = "jobquest-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "python-dotenv>=1.1.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2.0,<3.0",
]

[project.scripts]
jobquest-ai = "jobquest_ai.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
