[project]
name = "jobquest-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docx>=0.2.4",
    "langchain-core>=1.7.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-qdrant>=1.1.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
jobquest-ai = "jobquest_ai:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
